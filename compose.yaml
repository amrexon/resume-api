services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - VISITOR_SALT=${VISITOR_SALT}
    volumes:
      - cvdata:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  cvdata:
    external: true
  caddy_data:
  caddy_config:
